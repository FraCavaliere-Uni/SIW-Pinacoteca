<!DOCTYPE html>
<html>

<head>
	<title>SVP - Opere</title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>

<body>
	<aside th:replace="~{fragments/sidebar}"></aside>
			
	<div class="main-container">

		<h1 class="main-title">Consulta opere</h1>
		<a class="fake-button" href="/formSearchArtworks"><i class="fa-solid fa-magnifying-glass"></i> Cerca opere</a>
		<br>
		<br>
		<div th:if="${artworks==null || artworks.isEmpty()}">Non ci sono opere nel sistema</div>
	
		<ul class="list">
			<a th:each="artwork : ${artworks}"th:href="@{'/artwork' + '/' + ${artwork.id}}">
			<li th:text="${artwork.title} + ', ' + ${artwork.year}"></li></a>
			
		</ul>
	</div>
</body>

</html>
