<!DOCTYPE html>
<html>

<head>
	<title>SVP - Artisti</title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>

<body>
	<aside th:replace="~{fragments/sidebar}"></aside>
		
	<div class="main-container">

		<h1 class="main-title">Artisti</h1>
		<div th:if="${artists==null || artists.isEmpty()}">Non ci sono artisti nel sistema</div>
		<ul class="list">
			<a th:each="artist : ${artists}" th:href="@{'/artist' + '/' + ${artist.id}}">
			<li th:text="${artist.name} + ' ' + ${artist.surname}"></li></a>
		
		</ul>
	</div>
</body>

</html>
