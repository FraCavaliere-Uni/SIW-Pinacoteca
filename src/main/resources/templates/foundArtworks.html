<!DOCTYPE html>
<html>

<head>
	<title>SVP - Opere</title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>

<body>
	<aside th:replace="~{fragments/sidebar}"></aside>
			
	<div class="main-container">

		<h1>Opere che soddisfano i requisiti</h1>
		<div th:if="${artworks.isEmpty()}">Non ci sono opere che soddisfano i requisiti</div>
		<ul class = "list" th:if="${!artworks.isEmpty()}">
			<a th:each="artwork : ${artworks}"	href="artwork.html" th:href="@{'/artwork' + '/' + ${artwork.id}}">
			<li th:text="${artwork.title} + ' (' + ${artwork.year}+')'"></li></a>
		</ul>
	</div>
</body>

</html>
