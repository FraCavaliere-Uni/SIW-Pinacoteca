<!DOCTYPE html>
<html>

<head>
	<title>Curatori</title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>

<body>
	<aside th:replace="~{fragments/sidebar}"></aside>
				
		<div class="main-container">

			<h1 class="main-title">Curatori</h1>
			
			<div th:if="${curators.isEmpty()}">Non ci sono curatori nel sistema</div>
			
			<ul class="list">
				<a th:each="curator : ${curators}" th:href="@{'/admin/curator' + '/' + ${curator.id}}">
				<li th:text="${curator.name} + ' ' + ${curator.surname}"></li></a>
		
			</ul>
	</div>

</body>

</html>
