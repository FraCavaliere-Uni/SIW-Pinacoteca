<!DOCTYPE html>
<html>

<head>
	<title th:text="'SVPa - ' + ${action == 'create' ? 'Crea' : 'Aggiorna'} + ' Opera'">
		
	</title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>

<body>
	<aside th:replace="~{fragments/sidebar}"></aside>
	
	<div class="main-container">
	<h1 class="main-title" th:text="${action == 'create' ? 'Crea' : 'Aggiorna'} + ' Opera'"></h1>

	

	
		<form class="form" th:action="@{${action == 'create' ? '/admin/submitArtwork' : '/admin/submitArtwork/' + artwork.id}}" 
		      method="POST" th:object="${artwork}">

			  <div class="input-group">
		    <label>Titolo:</label>
		    <input type="text" id="title" th:field="*{title}" required><br><br>
		    
		    <label>Anno:</label>
		    <input type="number" id="year" th:field="*{year}" min="0" required><br><br>

		    <input type="hidden" id="urlImage" th:field="*{urlImage}">

		    <label>Tecnica:</label>
		    <input type="text" id="technique" th:field="*{technique}"><br><br>

			<input type="hidden" name="artist.id" th:value="*{artist?.id} != null ? *{artist.id} : null" />
			<input type="hidden" name="sala.id" th:value="*{sala?.id} != null ? *{sala.id} : null" />
			
		    <button type="submit">
		        <span th:text="${action == 'create' ? 'Crea' : 'Aggiorna'} + ' Opera'"></span>
		    </button>
			
			<span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>

			</div>
		</form>
	</div>
	

</body>

</html>
